[project]
name = "unified-planning"
version = "1.3.0"
description = "Unified Planning Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AIPlan4EU Project", email = "aiplan4eu@fbk.eu" }]
keywords = ["planning", "logic", "STRIPS", "RDDL"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pyparsing>=3.0.0",
    "networkx>=3.0",
    "ConfigSpace>=1.2.2",
    "pddl>=0.4.8",
    "pysmt>=0.9.6",
    "z3-solver>=4.13.0",
]

[project.urls]
Homepage = "https://www.aiplan4eu-project.eu"
Documentation = "https://unified-planning.readthedocs.io/en/latest/"
Source = "https://github.com/aiplan4eu/unified-planning"
Issues = "https://github.com/aiplan4eu/unified-planning/issues"

[project.scripts]
up = "unified_planning.cmd.up:main"

[project.optional-dependencies]
grpc = [
    # Floors set by the committed bindings themselves: unified_planning_pb2_grpc.py raises
    # if grpcio is older than the version it was generated against, and
    # unified_planning_pb2.py calls ValidateProtobufRuntimeVersion(PUBLIC, 6, 31, 1, ...),
    # which fails unless the protobuf runtime major matches the gencode major.
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "grpc-stubs>=1.53.0.5",
    "protobuf>=6.31.1,<7",
]
tarski = [
    "tarski[arithmetic]>=0.9.0",
    "clingo>=5.7",
]
pyperplan = ["up-pyperplan~=1.1.0"]
tamer = ["up-tamer~=1.1.6"]
tamerlite = ["tamerlite[rust]~=0.1.0"]
enhsp = ["up-enhsp~=0.1.0"]
fast-downward = ["up-fast-downward~=0.5.2"]
lpg = ["up-lpg~=0.1.2"]
fmap = ["up-fmap~=0.0.13"]
aries = ["up-aries>=0.4.0"]
symk = ["up-symk>=1.3.0"]
engines = [
    "unified-planning[tarski,pyperplan,tamer,tamerlite,enhsp,fast-downward,lpg,fmap,aries,symk]",
]
plot = [
    "plotly>=6.1",
    "kaleido>=1.0",
    "matplotlib>=3.6",
    "pygraphviz>=1.11",
    "graphviz>=0.20",
    "pandas>=1.5",
]

[dependency-groups]
dev = [
    # Exact, unlike the public `grpc` extra: the version the committed bindings are
    # generated against, asserted by `just check-protobuf-version`. 1.76.0 is the oldest
    # release with wheels for every supported interpreter, 3.14 included, so it keeps the
    # floor the generated code imposes on users as low as 3.14 support allows.
    "grpcio==1.83.0",
    "grpcio-tools==1.76.0",
    "grpc-stubs>=1.53.0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Exact so that type errors appear on code change, not on tool drift.
    "mypy==1.12.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5",
]
docs = [
    "sphinx>=7.2",
    "sphinx_rtd_theme>=2.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "nbsphinx_link>=1.3",
    "linkify-it-py>=2.0",
    "jupyter>=1.0",
    "tarski>=0.9.0",
    "docutils>=0.20,<0.21",
    "requests>=2.28",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unified_planning", "up_test_cases"]

[tool.hatch.build.targets.sdist]
include = [
    "/unified_planning",
    "/up_test_cases",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/justfile",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# generated protobuf code and docs (notebooks/snippets with IPython magics) are excluded
extend-exclude = ["unified_planning/grpc/generated", "docs"]

# ruff is used purely as the formatter here — the drop-in replacement for black.
# Linting is intentionally disabled: enabling unused-import/import-sorting autofixes
# rewrites re-export modules (e.g. unified_planning/interop/tarski.py) and changes the
# public API. Adopting lint rules is left to a dedicated follow-up PR.
[tool.ruff.lint]
select = []

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["unified_planning"]
addopts = "--doctest-modules --ignore=unified_planning/grpc --ignore=unified_planning/interop --ignore=unified_planning/engines"

[tool.mypy]
check_untyped_defs = true
files = ["unified_planning"]

[[tool.mypy.overrides]]
module = ["unified_planning.grpc.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tarski.*", "tamerlite.*", "networkx.*", "pyparsing.*", "pysmt.*", "pddl.*"]
ignore_missing_imports = true
