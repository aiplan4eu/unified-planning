[project]
name = "unified-planning"
dynamic = ["version"]
description = "Unified Planning Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AIPlan4EU Project", email = "aiplan4eu@fbk.eu" }]
keywords = ["planning", "logic", "STRIPS", "RDDL"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pyparsing>=3.0.0",
    "networkx>=3.0",
    "ConfigSpace>=1.2.2",
    "pddl>=0.4.8",
    "pysmt>=0.9.6",
    "z3-solver>=4.13.0",
]

[project.urls]
Homepage = "https://www.aiplan4eu-project.eu"
Documentation = "https://unified-planning.readthedocs.io/en/latest/"
Source = "https://github.com/aiplan4eu/unified-planning"
Issues = "https://github.com/aiplan4eu/unified-planning/issues"

[project.scripts]
up = "unified_planning.cmd.up:main"

[project.optional-dependencies]
grpc = [
    # Floors set by the committed bindings themselves: unified_planning_pb2_grpc.py raises
    # if grpcio is older than the version it was generated against, and
    # unified_planning_pb2.py calls ValidateProtobufRuntimeVersion(PUBLIC, 6, 31, 1, ...),
    # which fails unless the protobuf runtime major matches the gencode major.
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "grpc-stubs>=1.53.0.5",
    "protobuf>=6.31.1,<7",
]
tarski = [
    "tarski[arithmetic]>=0.9.0",
    "clingo>=5.7",
]
pyperplan = ["up-pyperplan~=1.1.0"]
tamer = ["up-tamer~=1.1.6"]
tamerlite = ["tamerlite[rust]~=0.1.0"]
enhsp = ["up-enhsp~=0.1.0"]
fast-downward = ["up-fast-downward~=0.5.2"]
lpg = ["up-lpg~=0.1.2"]
fmap = ["up-fmap~=0.0.13"]
aries = ["up-aries>=0.4.0"]
symk = ["up-symk>=1.3.0"]
engines = [
    "unified-planning[tarski,pyperplan,tamer,tamerlite,enhsp,fast-downward,lpg,fmap,aries,symk]",
]
plot = [
    "plotly>=6.1",
    "kaleido>=1.0",
    "matplotlib>=3.6",
    "pygraphviz>=1.11",
    "graphviz>=0.20",
    "pandas>=1.5",
]

[dependency-groups]
dev = [
    # Exact, unlike the public `grpc` extra: the version the committed bindings are
    # generated against, asserted by `just check-protobuf-version`. 1.76.0 is the oldest
    # release with wheels for every supported interpreter, 3.14 included, so it keeps the
    # floor the generated code imposes on users as low as 3.14 support allows.
    "grpcio==1.76.0",
    "grpcio-tools==1.76.0",
    "grpc-stubs>=1.53.0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Exact so that type errors appear on code change, not on tool drift.
    "mypy==2.3.1",
    # Exact, like mypy: `lint.ignore` names rule codes and ruff hard-errors on an unknown one.
    "ruff==0.16.5",
    "pre-commit>=3.5",
]
docs = [
    "sphinx>=7.2",
    "sphinx_rtd_theme>=2.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "nbsphinx_link>=1.3",
    "linkify-it-py>=2.0",
    "jupyter>=1.0",
    "tarski>=0.9.0",
    "docutils>=0.20,<0.21",
    "requests>=2.28",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# Keep the default guess-next-dev scheme: master builds must sort above the
# last release. The fallback covers a tree with neither git nor a PKG-INFO.
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["unified_planning", "up_test_cases"]

[tool.hatch.build.targets.sdist]
include = [
    "/unified_planning",
    "/up_test_cases",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/justfile",
]

[tool.ruff]
line-length = 88
target-version = "py310"
# generated protobuf code and docs (notebooks/snippets with IPython magics) are excluded
extend-exclude = ["unified_planning/grpc/generated", "docs"]
# "up_test_cases" is what makes report.py's `from utils import ...` sort as first-party.
src = [".", "up_test_cases"]

# Rules are adopted family by family, each with the fixes it requires. Deliberately never
# selected: E501 (the formatter owns line width), COM (the formatter's job, and ruff warns
# COM812 conflicts with it), D (the docstrings are Sphinx/reST prose, not PEP 257), ANN (mypy
# owns annotation coverage), ARG (the walker and mixin signatures are protocol-driven), and TC
# (it would move `import unified_planning as up` into TYPE_CHECKING and break the runtime uses).
[tool.ruff.lint]
select = [
    "E4",    # pycodestyle: import placement
    "E9",    # pycodestyle: syntax and IO errors
    "W",     # pycodestyle warnings
    "ASYNC", # flake8-async
    "LOG",   # flake8-logging
    "T10",   # flake8-debugger
    "TID",   # flake8-tidy-imports
    "YTT",   # flake8-2020: sys.version comparisons
    "I",     # isort
    "F401",  # unused-import
    "F402",  # import-shadowed-by-loop-var
    "F403",  # undefined-local-with-import-star
    "F405",  # undefined-local-with-import-star-usage
    "F811",  # redefined-while-unused
]

[tool.ruff.lint.per-file-ignores]
# Re-export façades: that is the job of these files, and downstream engine packages import
# names straight out of them. `__all__` is not used instead - adding the missing names to
# model/__init__.py's would change what `from unified_planning.shortcuts import *` yields.
"**/__init__.py" = ["F401"]
# shortcuts.py is the star-export surface itself: `from unified_planning.model import *` is how
# `from unified_planning.shortcuts import *` reaches the model API, so the star import and
# every name arriving through it are by design.
"unified_planning/shortcuts.py" = ["F403", "F405"]
# The CLI and the protobuf writer consume that surface deliberately.
"unified_planning/cmd/up.py" = ["F403", "F405"]
"unified_planning/grpc/proto_writer.py" = ["F403", "F405"]
# Scoped to these two trees rather than globally, so a *new* star import in library code is an error.
"unified_planning/test/**" = ["F403", "F405"]
"up_test_cases/**" = ["F403", "F405"]
# Import order in these four modules is load-bearing: each re-exports names that a sibling
# submodule pulls back out of the partially-initialised package, so sorting them raises
# ImportError or AttributeError at import time. No isort setting avoids it.
"unified_planning/model/__init__.py" = ["I001"]
"unified_planning/model/mixins/__init__.py" = ["I001"]
"unified_planning/model/walkers/__init__.py" = ["I001"]
"unified_planning/plans/__init__.py" = ["I001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["unified_planning"]
addopts = "--doctest-modules --ignore=unified_planning/grpc --ignore=unified_planning/interop --ignore=unified_planning/engines"

[tool.mypy]
check_untyped_defs = true
files = ["unified_planning"]
# An ignore that no longer suppresses anything is a false statement about the code.
warn_unused_ignores = true
no_implicit_optional = true
# Same argument as warn_unused_ignores, for a cast mypy can prove is a no-op.
warn_redundant_casts = true
# `x == y` between types that cannot overlap is always False at runtime, i.e. always a bug.
strict_equality = true
# Code mypy proves unreachable is also code mypy never checks. Version- and platform-gated
# blocks are exempt by mypy itself, so this does not fire on the `sys.platform` branches.
warn_unreachable = true
# A new suppression has to name what it suppresses; a whole-file `# type: ignore` is exempt.
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = ["unified_planning.grpc.generated.*"]
ignore_errors = true

# Third-party packages that ship no type information and have no stubs installed. The `plot`
# extra is covered here rather than by per-import ignores, so that warn_unused_ignores answers
# the same whether or not the extra is installed.
[[tool.mypy.overrides]]
module = [
    "graphviz.*",
    "matplotlib.*",
    "networkx.*",
    "pddl.*",
    "plotly.*",
    "pysmt.*",
    "tamerlite.*",
    "tarski.*",
]
ignore_missing_imports = true
