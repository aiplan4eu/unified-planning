name: test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:

permissions:
  contents: read

env:
  up_pyperplan_commit: "a24854213caf5038e1540e31613d24b93825fbb3"
  up_fast_downward_commit: "68dff9e38ba1fa33cba2728d7ba18cbf01aacd99"
  up_enhsp_commit: "4d9e925858483869093eee07d31e37305a120321"
  up_fmap_commit: "f29e66c8483abcb8f17ff1c46a0745ee9b1e95fa"

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz and gringo
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev gringo

      - name: Check formatting (ruff)
        run: just lint

      - name: MyPy check
        run: just typecheck

      - name: Test all package imports
        run: just check-imports

  check-protobuf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Re-generate the protobuf bindings
        run: just gen-protobuf

      - name: Check that committed bindings match the generated ones
        run: git diff --exit-code

  check-documentation:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pandoc and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc graphviz graphviz-dev

      - name: Build docs
        run: just build-doc

  run-tests-ubuntu:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz and gringo
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev gringo

      - name: Sync environment (with plot + tarski extras)
        run: uv sync --frozen --extra plot --extra tarski

      - name: Install tamerlite
        run: uv pip install "tamerlite[rust]"

      - name: Checkout up-pyperplan
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-pyperplan
          path: up-pyperplan
          ref: ${{ env.up_pyperplan_commit }}

      - name: Install up-pyperplan
        run: uv pip install ./up-pyperplan

      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      - name: Test code-snippets
        run: just test-snippets

      - name: Run tests
        run: just test unified_planning xml

      - name: Upload coverage to Codecov
        if: ${{ github.repository == 'aiplan4eu/unified-planning' && inputs.python-version == '3.10' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  run-tests-windows:
    runs-on: windows-latest
    needs: [basic-check, check-protobuf]
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Sync environment
        run: uv sync --frozen

      - name: Install tamerlite
        run: uv pip install "tamerlite[rust]"

      - name: Checkout up-pyperplan
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-pyperplan
          path: up-pyperplan
          ref: ${{ env.up_pyperplan_commit }}

      - name: Install up-pyperplan
        run: uv pip install ./up-pyperplan

      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      - name: Run tests
        run: just test

  run-tests-macos:
    runs-on: macos-latest
    needs: [basic-check, check-protobuf]
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Sync environment (with tarski extra)
        run: uv sync --frozen --extra tarski

      - name: Install tamerlite
        run: uv pip install "tamerlite[rust]"

      - name: Checkout up-pyperplan
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-pyperplan
          path: up-pyperplan
          ref: ${{ env.up_pyperplan_commit }}

      - name: Install up-pyperplan
        run: uv pip install ./up-pyperplan

      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      - name: Run tests
        run: just test

  run-colab-notebooks:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]
    env:
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      - name: Sync environment (with plot extra)
        run: uv sync --frozen --extra plot

      - name: Install tamerlite
        run: uv pip install "tamerlite[rust]"

      - name: Checkout up-pyperplan
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-pyperplan
          path: up-pyperplan
          ref: ${{ env.up_pyperplan_commit }}

      - name: Install up-pyperplan
        run: uv pip install ./up-pyperplan

      - name: Checkout up-fast-downward
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-fast-downward
          path: up-fast-downward
          ref: ${{ env.up_fast_downward_commit }}

      - name: Install up-fast-downward
        run: uv pip install ./up-fast-downward

      - name: Setup java for ENHSP
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Setup older setuptools for ENHSP
        run: uv pip install "setuptools<82" # ENHSP requires pkg_resources

      - name: Checkout up-enhsp
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-enhsp
          path: up-enhsp
          ref: ${{ env.up_enhsp_commit }}

      - name: Install up-enhsp
        run: uv pip install ./up-enhsp

      - name: Install up-aries
        run: uv pip install up-aries

      - name: Checkout up-fmap
        uses: actions/checkout@v4
        with:
          repository: aiplan4eu/up-fmap
          path: up-fmap
          ref: ${{ env.up_fmap_commit }}

      - name: Install up-fmap
        run: uv pip install ./up-fmap

      - name: Install jupyter and ipython
        run: uv pip install jupyter ipython

      - name: Run colabs
        run: just test-colab
