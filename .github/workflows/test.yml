name: test

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:

permissions:
  contents: read

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      - name: Lint
        env:
          # inline PR annotations for `ruff check`; `ruff format --check` ignores it
          RUFF_OUTPUT_FORMAT: github
        run: just lint

      - name: MyPy check
        run: just typecheck

      - name: Test all package imports
        run: just check-imports

  check-protobuf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}
          # Starts at the same time as basic-check and computes the same cache key, so on
          # a cold cache the two would race to reserve it. basic-check writes; this reads.
          save-cache: "false"

      - name: Re-generate the protobuf bindings
        run: just gen-protobuf

      - name: Check that committed bindings match the generated ones
        run: git diff --exit-code

  check-documentation:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # docs/conf.py reads the installed version; a shallow clone makes
          # hatch-vcs report 0.0.1.dev1 and the docs render as version 0.0
          fetch-depth: 0

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pandoc and graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc graphviz graphviz-dev

      - name: Build docs
        run: just build-doc

  run-tests-ubuntu:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]
    env:
      # The `uv sync --frozen` below is authoritative; this stops the `uv run`
      # behind every `just` recipe from re-checking the lock and re-syncing.
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      # Provisions Java and restores the cached build, so the setup-ci step below finds the
      # jar already in place. Must come first: setup-ci builds ENHSP when it is missing, and
      # that needs a JDK.
      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      # uv sync is exact: it prunes whatever is not named here, so every extra
      # this job needs must be listed on this one line.
      - name: Set up the environment (with plot + tarski + tamerlite + pyperplan extras)
        run: just setup-ci plot tarski tamerlite pyperplan

      - name: Test code-snippets
        run: just test-snippets

      - name: Run tests
        run: just test unified_planning xml

      - name: Upload coverage to Codecov
        if: ${{ github.repository == 'aiplan4eu/unified-planning' && github.ref == 'refs/heads/master' && inputs.python-version == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  run-tests-windows:
    runs-on: windows-latest
    needs: [basic-check, check-protobuf]
    env:
      # See run-tests-ubuntu.
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      # See run-tests-ubuntu: ENHSP first, so setup-ci finds the jar already built.
      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      # Exact sync: list every extra this job needs on this one line.
      - name: Set up the environment (with tarski + tamerlite + pyperplan extras)
        run: just setup-ci tarski tamerlite pyperplan

      - name: Run tests
        run: just test

  run-tests-macos:
    runs-on: macos-latest
    needs: [basic-check, check-protobuf]
    env:
      # See run-tests-ubuntu.
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      # See run-tests-ubuntu: ENHSP first, so setup-ci finds the jar already built.
      - name: Install ENHSP
        uses: ./.github/actions/install-enhsp

      # Exact sync: list every extra this job needs on this one line.
      - name: Set up the environment (with tarski + tamerlite + pyperplan extras)
        run: just setup-ci tarski tamerlite pyperplan

      - name: Run tests
        run: just test

  run-colab-notebooks:
    runs-on: ubuntu-latest
    needs: [basic-check, check-protobuf]
    env:
      # Load-bearing here: `uv run` restores lock-pinned versions, so without
      # this `just test-colab` would undo the setuptools downgrade below.
      UV_NO_SYNC: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv and just
        uses: ./.github/actions/setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      # Exact sync: list every extra and group this job needs on this one line.
      # The docs group supplies jupyter and ipython, which scripts/test_colab.sh
      # needs; the engine extras cover what the notebooks plan with.
      - name: Sync environment (with plot + engine extras, docs group)
        run: uv sync --frozen --extra plot --extra tamerlite --extra aries --extra pyperplan --extra fast-downward --extra enhsp --extra fmap --group docs

      # up-enhsp and up-fmap both shell out to java.
      - name: Setup java for the ENHSP and FMAP engines
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "17"

      # Must stay after the sync, which would otherwise prune the downgrade away.
      - name: Downgrade setuptools for up-fmap
        run: uv pip install "setuptools<82" # up_fmap.fmap_planner imports pkg_resources

      - name: Run colabs
        run: just test-colab
