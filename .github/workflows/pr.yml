name: CI-on-PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.14"

    uses: ./.github/workflows/test.yml

    with:
      python-version: ${{ matrix.python-version }}

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
