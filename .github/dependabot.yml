version: 2
updates:
  # Python dependencies from pyproject.toml / uv.lock (PyPI + any git sources).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - python

  # Pinned action versions, batched into one weekly PR. "/" covers
  # .github/workflows/; the glob is needed for the composite actions, which
  # dependabot does not reach otherwise.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
