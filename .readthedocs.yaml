version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.10"

sphinx:
   configuration: docs/conf.py

# Install the project plus the locked `docs` dependency group from uv.lock,
# mirroring the `just build-doc` recipe.
python:
   install:
   - method: uv
     command: sync
     groups:
     - docs
